<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Алиса</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23fc5f2b'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --coral: #fc5f2b;
    --carbon: #18181b;
    --zinc: #71717a;
    --ash: #a1a1aa;
    --mist: #e4e4e7;
    --fog: #f4f4f5;
    --paper: #ffffff;
    --font: "Inter Tight", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --shadow-subtle: rgba(0,0,0,.05) 0 2px 2px 0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--carbon);
    font: 400 15px/1.5 var(--font);
    letter-spacing: -0.005em;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .mono {
    font-family: var(--mono); font-size: 11px; line-height: 1.5;
    letter-spacing: -0.006em; text-transform: uppercase;
  }
  .display { font-size: 66px; line-height: 1; letter-spacing: -0.025em; font-weight: 400; margin: 0; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--coral); }

  /* ---------- Экран пароля ---------- */
  #lock {
    min-height: 100vh; min-height: 100dvh;
    display: grid; place-items: center;
    padding: 24px 16px;
    text-align: center;
    color: var(--paper);
    background:
      radial-gradient(120% 70% at 50% 110%, rgba(252,95,43,.22), transparent 60%),
      radial-gradient(90% 60% at 50% 0%, #1f2a33 0%, transparent 70%),
      #0c0c0e;
  }
  #lock .card { width: 100%; max-width: 400px; }
  #lock .display { font-size: clamp(56px, 16vw, 88px); }
  #lock .date { color: rgba(255,255,255,.6); font-size: 17px; line-height: 1.4; letter-spacing: -0.009em; margin: 16px 0 40px; }
  #lock form { display: flex; gap: 8px; }
  #lock input {
    flex: 1; min-width: 0;
    font: inherit; font-size: 15px; padding: 14px 20px;
    border: 1px solid rgba(255,255,255,.14); border-radius: 9999px;
    background: rgba(255,255,255,.06); color: var(--paper); outline: none;
  }
  #lock input::placeholder { color: rgba(255,255,255,.45); }
  #lock input:focus { border-color: rgba(255,255,255,.4); }
  .cta {
    font: 700 15px/1 var(--font); letter-spacing: -0.009em; cursor: pointer;
    border: 0; border-radius: 9999px; padding: 15px 24px;
    background: var(--coral); color: var(--paper);
    display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  .cta:disabled { opacity: .6; cursor: default; }
  #lock .err { color: #ff8b64; min-height: 22px; margin-top: 12px; font-size: 13px; }
  #lock .trust { margin-top: 24px; color: rgba(255,255,255,.45); }
  .shake { animation: shake .35s; }
  @keyframes shake { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

  /* ---------- Альбом ---------- */
  #album { display: none; }
  nav {
    position: sticky; top: 12px; z-index: 5;
    max-width: 1200px; margin: 12px auto 0; width: calc(100% - 32px);
    background: var(--carbon); color: var(--paper);
    border-radius: 15px; padding: 12px 19px;
    display: flex; align-items: center; gap: 16px;
  }
  nav .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; letter-spacing: -0.012em; }
  nav .age { flex: 1; text-align: center; color: rgba(255,255,255,.6); font-size: 13px; }
  nav a { color: rgba(255,255,255,.6); font-size: 13px; text-decoration: none; }
  nav a:hover { color: var(--paper); text-decoration: underline; }
  header {
    max-width: 1200px; margin: 0 auto;
    padding: 75px 16px 16px;
  }
  header .sub { color: var(--zinc); font-size: 17px; line-height: 1.4; letter-spacing: -0.009em; margin-top: 16px; max-width: 480px; }
  header .meta { color: var(--zinc); margin-top: 24px; display: flex; gap: 16px; flex-wrap: wrap; }
  main { max-width: 1200px; margin: 0 auto; padding: 0 16px 75px; }
  .day { border-top: 1px solid var(--mist); margin-top: 60px; padding-top: 24px; }
  .day-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
  .day-title { font-size: 30px; line-height: 1.2; letter-spacing: -0.013em; font-weight: 400; margin: 0; }
  .day-head .mono { color: var(--zinc); }
  .grid { columns: 3 280px; column-gap: 11px; }
  .tile {
    break-inside: avoid; margin-bottom: 11px;
    border-radius: 15px; overflow: hidden;
    background: var(--fog);
    cursor: zoom-in; position: relative;
  }
  .tile img { display: block; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .4s, transform .6s; }
  .tile img.ready { opacity: 1; }
  .tile:hover img.ready { transform: scale(1.02); }
  .empty {
    margin-top: 60px; padding: 60px 19px; text-align: center;
    border: 1px solid var(--mist); border-radius: 15px; background: var(--paper);
    box-shadow: var(--shadow-subtle);
  }
  .empty h3 { font-size: 22px; line-height: 1.25; letter-spacing: -0.012em; font-weight: 400; margin: 0 0 8px; }
  .empty p { color: var(--zinc); margin: 0; }
  footer { max-width: 1200px; margin: 0 auto; padding: 24px 16px 40px; border-top: 1px solid var(--mist); color: var(--ash); display: flex; justify-content: space-between; }

  /* ---------- Просмотр фото ---------- */
  #viewer {
    position: fixed; inset: 0; z-index: 10;
    background: #0c0c0e;
    display: none; align-items: center; justify-content: center;
    touch-action: pan-y;
  }
  #viewer.open { display: flex; }
  #viewer img { max-width: 100vw; max-height: 100vh; max-height: 100dvh; object-fit: contain; user-select: none; }
  #viewer .btn {
    position: absolute; background: rgba(255,255,255,.1); color: var(--paper);
    width: 44px; height: 44px; padding: 0; border: 0; border-radius: 9999px; cursor: pointer;
    display: grid; place-items: center; font: 400 20px/1 var(--font);
  }
  #viewer .btn:hover { background: rgba(255,255,255,.2); }
  #v-close { top: 16px; right: 16px; }
  #v-dl { top: 16px; right: 68px; text-decoration: none; }
  #v-prev { left: 16px; top: 50%; transform: translateY(-50%); }
  #v-next { right: 16px; top: 50%; transform: translateY(-50%); }
  #v-count { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,.6); }
  @media (max-width: 600px) {
    .display { font-size: 56px; }
    header { padding-top: 60px; }
    nav .age { display: none; }
    nav .brand { flex: 1; }
    #v-prev, #v-next { display: none; }
    .grid { columns: 2; column-gap: 8px; }
    .tile { margin-bottom: 8px; border-radius: 7.5px; }
    .day { margin-top: 40px; }
    .day-title { font-size: 22px; }
  }
</style>
</head>
<body>

<section id="lock">
  <div class="card">
    <h1 class="display">Алиса</h1>
    <div class="date">Родилась 17 октября 2026</div>
    <form id="lock-form" autocomplete="on">
      <input type="text" name="username" value="alice" autocomplete="username" hidden>
      <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password" required autofocus>
      <button id="go" class="cta" type="submit">Войти <span aria-hidden="true">→</span></button>
    </form>
    <div class="err" id="err"></div>
    <div class="trust mono">Фото зашифрованы · доступ только по паролю</div>
  </div>
</section>

<section id="album">
  <nav>
    <div class="brand"><span class="dot"></span>Алиса</div>
    <div class="age" id="nav-age"></div>
    <a href="#" id="logout">Выйти</a>
  </nav>
  <header>
    <h1 class="display">Алиса</h1>
    <div class="sub">Родилась 17 октября 2026. Здесь собираем фотографии её первых дней.</div>
    <div class="meta mono"><span id="age"></span><span id="count"></span></div>
  </header>
  <main id="days"></main>
  <footer class="mono"><span>alicekowalski.com</span><span>2026</span></footer>
</section>

<div id="viewer" aria-modal="true" role="dialog">
  <img id="v-img" alt="">
  <a class="btn" id="v-dl" title="Скачать" download>↓</a>
  <button class="btn" id="v-close" title="Закрыть">×</button>
  <button class="btn" id="v-prev" title="Назад">‹</button>
  <button class="btn" id="v-next" title="Вперёд">›</button>
  <div id="v-count"></div>
</div>

<script>
const BIRTH = new Date(2026, 9, 17);
const STORE = "alice-album-pw";
let key = null, photos = [], current = -1;
const fullCache = new Map();

const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function deriveKey(password, cfg) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", hash: "SHA-256", salt: b64(cfg.salt), iterations: cfg.iterations },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}

async function fetchDecrypted(url) {
  const r = await fetch(url, { cache: "no-cache" });
  if (!r.ok) throw new Error(r.status);
  const buf = new Uint8Array(await r.arrayBuffer());
  return crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12));
}

async function blobUrl(kind, id) {
  const data = await fetchDecrypted(`data/${kind}/${id}.bin`);
  return URL.createObjectURL(new Blob([data], { type: "image/jpeg" }));
}

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}

function ageText() {
  const now = new Date();
  const days = Math.floor((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - BIRTH) / 864e5);
  if (days < 0) return "";
  if (days === 0) return "Сегодня день рождения";
  if (days < 60) return `Алисе ${days} ${plural(days, "день", "дня", "дней")}`;
  let months = (now.getFullYear() - BIRTH.getFullYear()) * 12 + now.getMonth() - BIRTH.getMonth();
  if (now.getDate() < BIRTH.getDate()) months--;
  if (months < 24) return `Алисе ${months} ${plural(months, "месяц", "месяца", "месяцев")}`;
  const years = Math.floor(months / 12);
  return `Алисе ${years} ${plural(years, "год", "года", "лет")}`;
}

const dayFmt = new Intl.DateTimeFormat("ru-RU", { day: "numeric", month: "long", year: "numeric" });

const photoCount = n => `${n} ${plural(n, "фото", "фото", "фото")}`;

function render() {
  $("age").textContent = $("nav-age").textContent = ageText();
  $("count").textContent = photoCount(photos.length);
  const root = $("days");
  root.innerHTML = "";
  if (!photos.length) {
    root.innerHTML = '<div class="empty"><h3>Фотографии скоро появятся</h3><p>Мы уже выбираем лучшие кадры.</p></div>';
    return;
  }
  const groups = new Map();
  photos.forEach((p, i) => {
    const day = (p.taken || "").slice(0, 10) || "—";
    if (!groups.has(day)) groups.set(day, []);
    groups.get(day).push(i);
  });
  const io = new IntersectionObserver(entries => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      io.unobserve(e.target);
      const img = e.target.querySelector("img");
      blobUrl("thumb", img.dataset.id).then(u => { img.src = u; img.onload = () => img.classList.add("ready"); });
    }
  }, { rootMargin: "600px" });

  for (const [day, idxs] of groups) {
    const d = new Date(day + "T12:00:00");
    const days = Math.round((d - BIRTH) / 864e5);
    const section = document.createElement("section");
    section.className = "day";
    const head = document.createElement("div");
    head.className = "day-head";
    const h = document.createElement("h2");
    h.className = "day-title";
    h.textContent = isNaN(d) ? "Без даты" : dayFmt.format(d).replace(" г.", "");
    const s = document.createElement("span");
    s.className = "mono";
    const label = isNaN(d) || days < 0 ? "" : days === 0 ? "День рождения · " : `День ${days + 1} · `;
    s.textContent = label + photoCount(idxs.length);
    head.append(h, s);
    const grid = document.createElement("div");
    grid.className = "grid";
    for (const i of idxs) {
      const p = photos[i];
      const t = document.createElement("div");
      t.className = "tile";
      t.style.aspectRatio = `${p.w} / ${p.h}`;
      t.innerHTML = `<img alt="" data-id="${p.id}">`;
      t.onclick = () => openViewer(i);
      grid.append(t);
      io.observe(t);
    }
    section.append(head, grid);
    root.append(section);
  }
}

async function showFull(i) {
  current = (i + photos.length) % photos.length;
  const p = photos[current];
  $("v-count").textContent = `${current + 1} / ${photos.length}`;
  const img = $("v-img");
  const thumb = document.querySelector(`img[data-id="${p.id}"]`);
  if (thumb && thumb.src) img.src = thumb.src;
  if (!fullCache.has(p.id)) fullCache.set(p.id, blobUrl("full", p.id));
  const url = await fullCache.get(p.id);
  if (photos[current] === p) {
    img.src = url;
    $("v-dl").href = url;
    $("v-dl").download = `alisa-${p.id}.jpg`;
  }
  const next = photos[(current + 1) % photos.length];
  if (!fullCache.has(next.id)) fullCache.set(next.id, blobUrl("full", next.id));
}

function openViewer(i) { $("viewer").classList.add("open"); document.body.style.overflow = "hidden"; showFull(i); }
function closeViewer() { $("viewer").classList.remove("open"); document.body.style.overflow = ""; current = -1; }
$("v-close").onclick = closeViewer;
$("v-prev").onclick = e => { e.stopPropagation(); showFull(current - 1); };
$("v-next").onclick = e => { e.stopPropagation(); showFull(current + 1); };
$("viewer").onclick = e => { if (e.target.id === "viewer") closeViewer(); };
document.addEventListener("keydown", e => {
  if (current < 0) return;
  if (e.key === "Escape") closeViewer();
  if (e.key === "ArrowLeft") showFull(current - 1);
  if (e.key === "ArrowRight") showFull(current + 1);
});
let touchX = null;
$("viewer").addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive: true });
$("viewer").addEventListener("touchend", e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 50) showFull(current + (dx < 0 ? 1 : -1));
  touchX = null;
});

async function unlock(password, remember) {
  const cfg = await (await fetch("data/config.json", { cache: "no-cache" })).json();
  key = await deriveKey(password, cfg);
  try {
    photos = JSON.parse(new TextDecoder().decode(await fetchDecrypted("data/manifest.bin")));
  } catch (e) {
    key = null;
    throw e;
  }
  if (remember) try { localStorage.setItem(STORE, password); } catch {}
  $("lock").style.display = "none";
  $("album").style.display = "block";
  render();
}

$("lock-form").onsubmit = async e => {
  e.preventDefault();
  $("go").disabled = true;
  $("err").textContent = "";
  try {
    await unlock($("pw").value, true);
  } catch {
    $("err").textContent = "Неверный пароль";
    $("lock-form").classList.remove("shake"); void $("lock-form").offsetWidth;
    $("lock-form").classList.add("shake");
  }
  $("go").disabled = false;
};

$("logout").onclick = e => {
  e.preventDefault();
  try { localStorage.removeItem(STORE); } catch {}
  location.reload();
};

(async () => {
  let saved = null;
  try { saved = localStorage.getItem(STORE); } catch {}
  if (saved) {
    try { await unlock(saved, false); }
    catch { try { localStorage.removeItem(STORE); } catch {} }
  }
})();
</script>
</body>
</html>

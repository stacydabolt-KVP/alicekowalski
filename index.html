<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Алиса</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='22' y='22' width='56' height='56' rx='10' transform='rotate(45 50 50)' fill='%23ff6363'/></svg>">
<meta name="theme-color" content="#040506">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #040506;
    --ink: #07080a;
    --obsidian: #111214;
    --graphite: #1b1c1e;
    --smoke: #6a6b6c;
    --ash: #9c9c9d;
    --mist: #e6e6e6;
    --iron: #454647;
    --border: #363739;
    --white: #ffffff;
    --coral: #ff6363;
    --font: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --mono: "Geist Mono", "JetBrains Mono", ui-monospace, Menlo, monospace;
    --key: rgba(255,255,255,.05) 0 1px 0 0 inset, rgba(255,255,255,.25) 0 0 0 1px, rgba(0,0,0,.2) 0 -1px 0 0 inset;
    --lift: rgba(0,0,0,.03) 0 7px 3px 0, rgba(0,0,0,.25) 0 4px 4px 0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--void);
    color: var(--white);
    font: 400 16px/1.5 var(--font);
    font-feature-settings: "calt", "kern", "liga", "ss03";
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .mono { font-family: var(--mono); font-size: 12px; line-height: 1.6; letter-spacing: .017em; color: var(--smoke); }
  .eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: .05em; text-transform: uppercase; color: var(--ash); }
  .display { font-size: 56px; line-height: 1.17; letter-spacing: .004em; font-weight: 400; margin: 0; }
  .diamond { width: 12px; height: 12px; border-radius: 3px; background: var(--coral); transform: rotate(45deg); flex: none; }

  /* Атмосферная подложка hero: красно-синяя геометрия */
  .atmo { position: relative; overflow: hidden; isolation: isolate; }
  .atmo::before, .atmo::after { content: ""; position: absolute; z-index: -1; pointer-events: none; }
  .atmo::before {
    inset: 0;
    background:
      radial-gradient(70% 55% at 50% 26%, rgba(4,63,150,.7), rgba(6,18,37,.25) 60%, transparent 80%),
      linear-gradient(to bottom, transparent 60%, var(--void));
  }
  .atmo::after {
    left: 50%; top: 18%; width: 140%; height: 120px;
    transform: translateX(-50%) rotate(-14deg);
    background: linear-gradient(90deg, transparent 10%, rgba(255,99,99,.75) 45%, rgba(99,161,255,.5) 70%, transparent 90%);
    filter: blur(40px); opacity: .7;
  }

  /* ---------- Экран пароля ---------- */
  #lock {
    min-height: 100vh; min-height: 100dvh;
    display: grid; place-items: center;
    padding: 24px 16px;
    text-align: center;
  }
  #lock .card { width: 100%; max-width: 400px; }
  #lock .eyebrow { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 24px; }
  #lock .display { font-size: clamp(56px, 14vw, 64px); line-height: 1.1; }
  #lock .date { color: var(--ash); font-size: 16px; margin: 16px 0 40px; }
  #lock form {
    display: flex; gap: 8px; padding: 8px;
    background: rgba(7,8,10,.6); backdrop-filter: blur(48px); -webkit-backdrop-filter: blur(48px);
    border-radius: 16px; box-shadow: var(--key);
  }
  #lock input {
    flex: 1; min-width: 0;
    font: inherit; padding: 8px 12px;
    border: 0; border-radius: 8px;
    background: rgba(255,255,255,.05); color: var(--white); outline: none;
  }
  #lock input::placeholder { color: var(--ash); }
  #lock input:focus { box-shadow: rgba(255,255,255,.25) 0 0 0 1px; }
  .btn-mist {
    font: 500 14px/1 var(--font); cursor: pointer;
    border: 0; border-radius: 8px; padding: 12px 16px;
    background: var(--mist); color: var(--iron); box-shadow: var(--lift);
    display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  .btn-mist:hover { background: var(--white); }
  .btn-mist:disabled { opacity: .6; cursor: default; }
  #lock .err { color: var(--ash); min-height: 24px; margin-top: 16px; font-size: 14px; }
  #lock .meta { margin-top: 16px; }
  .shake { animation: shake .35s; }
  @keyframes shake { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

  /* ---------- Альбом ---------- */
  #album { display: none; }
  nav {
    position: sticky; top: 16px; z-index: 5;
    max-width: 1200px; margin: 16px auto 0; width: calc(100% - 32px);
    background: rgba(4,5,6,.6); backdrop-filter: blur(48px); -webkit-backdrop-filter: blur(48px);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 8px 8px 16px;
    display: flex; align-items: center; gap: 16px;
  }
  nav .brand { display: flex; align-items: center; gap: 12px; font-weight: 500; font-size: 14px; letter-spacing: .014em; }
  nav .age { flex: 1; text-align: center; color: var(--ash); font-size: 13px; font-weight: 500; letter-spacing: .008em; }
  nav a.btn-mist { text-decoration: none; padding: 8px 12px; font-size: 13px; }
  header.atmo { margin-top: -64px; padding: 160px 16px 96px; text-align: center; }
  header .sub { color: var(--ash); font-size: 18px; line-height: 1.4; margin: 16px auto 0; max-width: 480px; }
  header .meta { margin-top: 24px; }
  header .meta span + span::before { content: " | "; color: var(--iron); }
  main { max-width: 1200px; margin: 0 auto; padding: 0 16px 120px; }
  .day { margin-top: 80px; }
  .day-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
  .day-title { font-size: 32px; line-height: 1.15; font-weight: 400; margin: 0; }
  .badge { background: var(--graphite); color: var(--white); border-radius: 6px; padding: 4px 8px; font-family: var(--mono); font-size: 12px; letter-spacing: .017em; white-space: nowrap; }
  .grid { columns: 3 280px; column-gap: 16px; }
  .tile {
    break-inside: avoid; margin-bottom: 16px;
    border-radius: 16px; overflow: hidden; padding: 0;
    background: var(--ink); box-shadow: var(--key);
    cursor: zoom-in; position: relative;
  }
  .tile img { display: block; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .4s; }
  .tile::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: var(--key); pointer-events: none; }
  .tile img.ready { opacity: 1; }
  .tile:hover::after { box-shadow: rgba(255,255,255,.1) 0 1px 0 0 inset, rgba(255,255,255,.5) 0 0 0 1px; }
  .empty {
    margin-top: 0; padding: 64px 24px; text-align: center;
    border-radius: 20px; background: var(--ink); box-shadow: var(--key);
  }
  .empty h3 { font-size: 24px; line-height: 1.15; font-weight: 500; margin: 0 0 8px; }
  .empty p { color: var(--ash); margin: 0; }
  footer { text-align: center; padding: 40px 16px 48px; border-top: 1px solid var(--graphite); }
  footer span + span::before { content: " | "; color: var(--iron); }

  /* ---------- Просмотр фото ---------- */
  #viewer {
    position: fixed; inset: 0; z-index: 10;
    background: var(--void);
    display: none; align-items: center; justify-content: center;
    touch-action: pan-y;
  }
  #viewer.open { display: flex; }
  #viewer img { max-width: 100vw; max-height: 100vh; max-height: 100dvh; object-fit: contain; user-select: none; }
  #viewer .btn {
    position: absolute; background: rgba(7,8,10,.6); color: var(--mist);
    backdrop-filter: blur(48px); -webkit-backdrop-filter: blur(48px);
    width: 40px; height: 40px; padding: 0; border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
    display: grid; place-items: center; font: 500 18px/1 var(--font);
  }
  #viewer .btn:hover { color: var(--white); border-color: var(--ash); }
  #v-close { top: 16px; right: 16px; }
  #v-dl { top: 16px; right: 64px; text-decoration: none; }
  #v-prev { left: 16px; top: 50%; transform: translateY(-50%); }
  #v-next { right: 16px; top: 50%; transform: translateY(-50%); }
  #v-count { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; }
  @media (max-width: 600px) {
    .display { font-size: 48px; }
    header.atmo { padding: 128px 16px 64px; }
    nav .age { display: none; }
    nav .brand { flex: 1; }
    #viewer #v-prev, #viewer #v-next { display: none; }
    .grid { columns: 2; column-gap: 8px; }
    .tile { margin-bottom: 8px; border-radius: 8px; }
    .day { margin-top: 56px; }
    .day-title { font-size: 24px; }
  }
</style>
</head>
<body>

<section id="lock" class="atmo">
  <div class="card">
    <div class="eyebrow"><span class="diamond"></span>Семейный альбом</div>
    <h1 class="display">Алиса</h1>
    <div class="date">Родилась 17 октября 2026</div>
    <form id="lock-form" autocomplete="on">
      <input type="text" name="username" value="alice" autocomplete="username" hidden>
      <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password" required autofocus>
      <button id="go" class="btn-mist" type="submit">Войти <span aria-hidden="true">↵</span></button>
    </form>
    <div class="err" id="err"></div>
    <div class="meta mono">Фото зашифрованы | доступ только по паролю</div>
  </div>
</section>

<section id="album">
  <nav>
    <div class="brand"><span class="diamond"></span>Алиса</div>
    <div class="age" id="nav-age"></div>
    <a href="#" id="logout" class="btn-mist">Выйти</a>
  </nav>
  <header class="atmo">
    <h1 class="display">Алиса</h1>
    <div class="sub">Родилась 17 октября 2026. Здесь собираем фотографии её первых дней.</div>
    <div class="meta mono"><span id="age"></span><span id="count"></span><span>alicekowalski.com</span></div>
  </header>
  <main id="days"></main>
  <footer class="mono"><span>alicekowalski.com</span><span>с любовью</span><span>2026</span></footer>
</section>
<div id="viewer" aria-modal="true" role="dialog">
  <img id="v-img" alt="">
  <a class="btn" id="v-dl" title="Скачать" download>↓</a>
  <button class="btn" id="v-close" title="Закрыть">×</button>
  <button class="btn" id="v-prev" title="Назад">‹</button>
  <button class="btn" id="v-next" title="Вперёд">›</button>
  <div id="v-count" class="mono"></div>
</div>

<script>
const BIRTH = new Date(2026, 9, 17);
const STORE = "alice-album-pw";
let key = null, photos = [], current = -1;
const fullCache = new Map();

const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function deriveKey(password, cfg) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", hash: "SHA-256", salt: b64(cfg.salt), iterations: cfg.iterations },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}

async function fetchDecrypted(url) {
  const r = await fetch(url, { cache: "no-cache" });
  if (!r.ok) throw new Error(r.status);
  const buf = new Uint8Array(await r.arrayBuffer());
  return crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12));
}

async function blobUrl(kind, id) {
  const data = await fetchDecrypted(`data/${kind}/${id}.bin`);
  return URL.createObjectURL(new Blob([data], { type: "image/jpeg" }));
}

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}

function ageText() {
  const now = new Date();
  const days = Math.floor((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - BIRTH) / 864e5);
  if (days < 0) return "";
  if (days === 0) return "Сегодня день рождения";
  if (days < 60) return `Алисе ${days} ${plural(days, "день", "дня", "дней")}`;
  let months = (now.getFullYear() - BIRTH.getFullYear()) * 12 + now.getMonth() - BIRTH.getMonth();
  if (now.getDate() < BIRTH.getDate()) months--;
  if (months < 24) return `Алисе ${months} ${plural(months, "месяц", "месяца", "месяцев")}`;
  const years = Math.floor(months / 12);
  return `Алисе ${years} ${plural(years, "год", "года", "лет")}`;
}

const dayFmt = new Intl.DateTimeFormat("ru-RU", { day: "numeric", month: "long", year: "numeric" });

const photoCount = n => `${n} ${plural(n, "фото", "фото", "фото")}`;

function render() {
  $("age").textContent = $("nav-age").textContent = ageText();
  $("count").textContent = photoCount(photos.length);
  const root = $("days");
  root.innerHTML = "";
  if (!photos.length) {
    root.innerHTML = '<div class="empty"><h3>Фотографии скоро появятся</h3><p>Мы уже выбираем лучшие кадры.</p></div>';
    return;
  }
  const groups = new Map();
  photos.forEach((p, i) => {
    const day = (p.taken || "").slice(0, 10) || "—";
    if (!groups.has(day)) groups.set(day, []);
    groups.get(day).push(i);
  });
  const io = new IntersectionObserver(entries => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      io.unobserve(e.target);
      const img = e.target.querySelector("img");
      blobUrl("thumb", img.dataset.id).then(u => { img.src = u; img.onload = () => img.classList.add("ready"); });
    }
  }, { rootMargin: "600px" });

  for (const [day, idxs] of groups) {
    const d = new Date(day + "T12:00:00");
    const days = Math.round((d - BIRTH) / 864e5);
    const section = document.createElement("section");
    section.className = "day";
    const head = document.createElement("div");
    head.className = "day-head";
    const h = document.createElement("h2");
    h.className = "day-title";
    h.textContent = isNaN(d) ? "Без даты" : dayFmt.format(d).replace(" г.", "");
    const s = document.createElement("span");
    s.className = "badge";
    const label = isNaN(d) || days < 0 ? "" : days === 0 ? "День рождения · " : `День ${days + 1} · `;
    s.textContent = label + photoCount(idxs.length);
    head.append(h, s);
    const grid = document.createElement("div");
    grid.className = "grid";
    for (const i of idxs) {
      const p = photos[i];
      const t = document.createElement("div");
      t.className = "tile";
      t.style.aspectRatio = `${p.w} / ${p.h}`;
      t.innerHTML = `<img alt="" data-id="${p.id}">`;
      t.onclick = () => openViewer(i);
      grid.append(t);
      io.observe(t);
    }
    section.append(head, grid);
    root.append(section);
  }
}

async function showFull(i) {
  current = (i + photos.length) % photos.length;
  const p = photos[current];
  $("v-count").textContent = `${current + 1} / ${photos.length}`;
  const img = $("v-img");
  const thumb = document.querySelector(`img[data-id="${p.id}"]`);
  if (thumb && thumb.src) img.src = thumb.src;
  if (!fullCache.has(p.id)) fullCache.set(p.id, blobUrl("full", p.id));
  const url = await fullCache.get(p.id);
  if (photos[current] === p) {
    img.src = url;
    $("v-dl").href = url;
    $("v-dl").download = `alisa-${p.id}.jpg`;
  }
  const next = photos[(current + 1) % photos.length];
  if (!fullCache.has(next.id)) fullCache.set(next.id, blobUrl("full", next.id));
}

function openViewer(i) { $("viewer").classList.add("open"); document.body.style.overflow = "hidden"; showFull(i); }
function closeViewer() { $("viewer").classList.remove("open"); document.body.style.overflow = ""; current = -1; }
$("v-close").onclick = closeViewer;
$("v-prev").onclick = e => { e.stopPropagation(); showFull(current - 1); };
$("v-next").onclick = e => { e.stopPropagation(); showFull(current + 1); };
$("viewer").onclick = e => { if (e.target.id === "viewer") closeViewer(); };
document.addEventListener("keydown", e => {
  if (current < 0) return;
  if (e.key === "Escape") closeViewer();
  if (e.key === "ArrowLeft") showFull(current - 1);
  if (e.key === "ArrowRight") showFull(current + 1);
});
let touchX = null;
$("viewer").addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive: true });
$("viewer").addEventListener("touchend", e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 50) showFull(current + (dx < 0 ? 1 : -1));
  touchX = null;
});

async function unlock(password, remember) {
  const cfg = await (await fetch("data/config.json", { cache: "no-cache" })).json();
  key = await deriveKey(password, cfg);
  try {
    photos = JSON.parse(new TextDecoder().decode(await fetchDecrypted("data/manifest.bin")));
  } catch (e) {
    key = null;
    throw e;
  }
  if (remember) try { localStorage.setItem(STORE, password); } catch {}
  $("lock").style.display = "none";
  $("album").style.display = "block";
  render();
}

$("lock-form").onsubmit = async e => {
  e.preventDefault();
  $("go").disabled = true;
  $("err").textContent = "";
  try {
    await unlock($("pw").value, true);
  } catch {
    $("err").textContent = "Неверный пароль";
    $("lock-form").classList.remove("shake"); void $("lock-form").offsetWidth;
    $("lock-form").classList.add("shake");
  }
  $("go").disabled = false;
};

$("logout").onclick = e => {
  e.preventDefault();
  try { localStorage.removeItem(STORE); } catch {}
  location.reload();
};

(async () => {
  let saved = null;
  try { saved = localStorage.getItem(STORE); } catch {}
  if (saved) {
    try { await unlock(saved, false); }
    catch { try { localStorage.removeItem(STORE); } catch {} }
  }
})();
</script>
</body>
</html>
